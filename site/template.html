<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awesome AI for Astronomy</title>
<meta name="description" content="Searchable index of papers, models, datasets, benchmarks and software for artificial intelligence in astronomy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --head: #eef1f5;
  --ink: #172036;
  --muted: #5a6377;
  --rule: #dde2ea;
  --accent: #b42318;
  --link: #1d4ed8;
  --mark: #fde7b0;
  --serif: "Spectral", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0f1629;
  --surface: #151e35;
  --head: #1b2541;
  --ink: #e7eaf1;
  --muted: #9ba4b8;
  --rule: #2b3653;
  --accent: #ff7b6c;
  --link: #8db4ff;
  --mark: #5b4a1c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); font-variant-numeric: tabular-nums; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px; }

/* Header */
.masthead { background: var(--surface); border-bottom: 1px solid var(--rule); }
.masthead .wrap { padding-top: 28px; padding-bottom: 22px; }
.titlebar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 24px; }
h1 { margin: 0; font: 600 36px/1.1 var(--serif); letter-spacing: -0.01em; }
.toplinks { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.toplinks a, .toplinks button { white-space: nowrap; }
.toplinks button { font: inherit; color: var(--muted); background: none; border: 1px solid var(--rule); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
.toplinks button:hover { color: var(--ink); border-color: var(--muted); }
.lede { max-width: 82ch; margin: 8px 0 0; color: var(--muted); font-size: 16px; }

/* Toolbar */
.toolbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule); }
.toolbar .wrap { display: grid; grid-template-columns: minmax(240px, 380px) minmax(0, 1fr) auto; gap: 10px 20px; align-items: center; padding-top: 12px; padding-bottom: 12px; }
.finder { position: relative; }
.finder input { width: 100%; font: 15px/1.3 var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 9px 36px 9px 12px; }
.finder input::placeholder { color: var(--muted); }
.finder input:focus { outline: none; border-color: var(--ink); }
.finder kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font: 12px/1 var(--sans); color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 6px; }
.years { display: flex; flex-wrap: wrap; gap: 4px; }
.years button { font: 13px/1 var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; cursor: pointer; }
.years button span { color: var(--muted); margin-left: 5px; font-size: 12px; }
.years button:hover { border-color: var(--muted); }
.years button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.years button[aria-pressed="true"] span { color: inherit; opacity: .75; }
.years button.zero { opacity: .45; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.toggles label { display: flex; gap: 6px; align-items: center; cursor: pointer; white-space: nowrap; }
.toggles input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }

/* Layout */
.layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; padding-top: 20px; padding-bottom: 64px; }
.toc { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 92px); overflow: auto; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc li ol { margin: 0 0 4px; }
.toc a { display: flex; justify-content: space-between; gap: 10px; padding: 4px 10px; border-left: 2px solid transparent; color: var(--ink); line-height: 1.3; font-size: 14px; }
.toc a:hover { background: var(--surface); text-decoration: none; }
.toc li ol a { padding-left: 22px; color: var(--muted); font-size: 13px; }
.toc a[aria-current="true"] { border-left-color: var(--accent); background: var(--surface); font-weight: 600; color: var(--ink); }
.toc .c { color: var(--muted); font-weight: 400; font-size: 12px; }
.toc a.zero { opacity: .45; }
.toc .all { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.tocselect { display: none; }

.status { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin: 0 0 4px; color: var(--muted); }
.linkbtn { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* Sections and tables */
.sec { margin-top: 28px; }
.sec > h2 { margin: 0 0 4px; font: 600 24px/1.25 var(--serif); }
.sub { margin-top: 18px; }
.sub > h3 { margin: 0 0 6px; font: 500 18px/1.3 var(--serif); }
h2 .c, h3 .c { font: 400 13px/1 var(--sans); color: var(--muted); margin-left: 10px; }
.secintro { color: var(--muted); max-width: 90ch; margin: 0 0 8px; }
.secintro p { margin: 0; }
.tbl { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin-top: 8px; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
col.cd { width: 86px; } col.cn { width: 150px; } col.cv { width: 170px; } col.ck { width: 160px; }
col.cln { width: 240px; }
thead th { background: var(--head); color: var(--muted); font-weight: 600; font-size: 13px; text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
tbody td { padding: 9px 12px; border-top: 1px solid var(--rule); vertical-align: top; }
tbody tr:first-child td { border-top: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--head) 55%, transparent); }
td.d { white-space: nowrap; color: var(--muted); }
td.n { font-weight: 600; overflow-wrap: anywhere; }
td.t a { color: var(--ink); font: 500 15.5px/1.4 var(--serif); }
td.t a:hover { color: var(--link); }
td.v { color: var(--muted); }
td.v.rev { color: var(--ink); }
td.k { overflow-wrap: anywhere; }
td.k a { margin-right: 10px; white-space: nowrap; }
td.k a.code { font-weight: 600; }
.sum { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
body.nosum .sum { display: none; }
.sum code { font-size: 12.5px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
td.ld { color: var(--muted); }
td.ln { font-weight: 600; }

.empty { margin-top: 28px; padding: 22px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; max-width: 60ch; }
.empty p { margin: 0 0 8px; }
footer { border-top: 1px solid var(--rule); color: var(--muted); font-size: 13px; }
footer .wrap { padding-top: 18px; padding-bottom: 28px; }
footer p { margin: 0 0 4px; }

@media (max-width: 1080px) {
  .toolbar .wrap { grid-template-columns: minmax(0, 1fr); }
  .toc { top: 16px; max-height: calc(100vh - 32px); }
  .toolbar { position: static; }
  col.cn { width: 120px; } col.cv { width: 140px; } col.ck { width: 130px; }
}
@media (max-width: 860px) {
  h1 { font-size: 30px; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 0; padding-top: 12px; }
  .toc { display: none; }
  .tocselect { display: block; margin-bottom: 10px; }
  .tocselect select { width: 100%; font: 15px var(--sans); padding: 9px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); }
  thead { display: none; }
  table, tbody, tr, td { display: block; width: auto !important; }
  tbody tr { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 10px 12px; border-top: 1px solid var(--rule); }
  tbody tr:first-child { border-top: 0; }
  tbody td { padding: 0; border: 0; }
  td.d { grid-column: 1; }
  td.n { grid-column: 2; }
  td.t, td.v, td.k, td.ln, td.ld { grid-column: 1 / -1; }
  td.v, td.k { font-size: 14px; }
}
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <div class="titlebar">
      <h1>Awesome AI for Astronomy</h1>
      <nav class="toplinks" aria-label="Project links">
        <a id="repo" href="#">GitHub repository</a>
        <a id="contrib" href="#">Add an entry</a>
        <button type="button" id="theme">Dark theme</button>
      </nav>
    </div>
    <p class="lede" id="lede"></p>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <form class="finder" role="search" onsubmit="return false">
      <label class="sr-only" for="q">Search the list</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search papers, models, venues">
      <kbd aria-hidden="true">/</kbd>
    </form>
    <div class="years" id="years" role="group" aria-label="Filter by year of first arXiv version"></div>
    <div class="toggles" role="group" aria-label="Filters">
      <label><input type="checkbox" id="fcode"> Has code</label>
      <label><input type="checkbox" id="frev"> Peer-reviewed</label>
      <label><input type="checkbox" id="fsum"> Summaries</label>
    </div>
  </div>
</div>

<div class="wrap layout">
  <nav class="toc" id="toc" aria-label="Sections"></nav>
  <main id="main">
    <div class="tocselect">
      <label class="sr-only" for="secsel">Section</label>
      <select id="secsel"></select>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div id="results"></div>
  </main>
</div>

<footer>
  <div class="wrap">
    <p id="built"></p>
    <p>Generated from data/entries.yml by scripts/build.py. To add or correct an entry, follow CONTRIBUTING.md.</p>
  </div>
</footer>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var S = D.sections;
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function strip(h) { return h.replace(/<[^>]+>/g, ""); }
  function isCode(l) { return /code/i.test(l); }

  var byId = {}, children = {}, all = [];
  S.forEach(function (s) {
    byId[s.id] = s;
    if (s.parent) (children[s.parent] = children[s.parent] || []).push(s.id);
    s.entries.forEach(function (e) {
      e.sec = s.id;
      e.top = s.parent || s.id;
      e.code = e.kind === "paper" && e.links.some(function (l) { return isCode(l.label); });
      e.hay = [e.name, e.title || "", e.venue || "", strip(e.desc), s.title, s.parent ? byId[s.parent].title : ""].join(" ").toLowerCase();
      all.push(e);
    });
  });
  var papers = all.filter(function (e) { return e.kind === "paper"; });
  var years = [];
  papers.forEach(function (e) { if (e.year && years.indexOf(e.year) < 0) years.push(e.year); });
  years.sort(function (a, b) { return b - a; });
  var topSecs = S.filter(function (s) { return !s.parent; });
  var tools = (byId["tools-and-libraries"] || { entries: [] }).entries.length;

  $("lede").textContent = "Papers, models, datasets, benchmarks and software for artificial intelligence in astronomy, astrophysics, cosmology, heliophysics and planetary science. " +
    papers.length + " papers and " + tools + " software packages, newest first within each section.";
  $("repo").href = D.repo;
  $("contrib").href = D.repo + "/blob/main/CONTRIBUTING.md";
  $("built").innerHTML = "Built from " + (D.commit ? '<a href="' + D.repo + "/commit/" + D.commit + '">commit ' + D.commit + "</a>" : "the repository") + " on " + D.built + ".";

  var st = { q: "", terms: [], years: {}, code: false, rev: false, sec: "" };
  function yearsOn() { return Object.keys(st.years).length > 0; }
  function paperOnly() { return yearsOn() || st.code || st.rev; }
  function inScope(e) { return !st.sec || e.sec === st.sec || e.top === st.sec; }
  function pass(e, ignoreYear) {
    for (var i = 0; i < st.terms.length; i++) if (e.hay.indexOf(st.terms[i]) < 0) return false;
    if (e.kind !== "paper") return !paperOnly();
    if (!ignoreYear && yearsOn() && !st.years[e.year]) return false;
    if (st.code && !e.code) return false;
    if (st.rev && !e.reviewed) return false;
    return true;
  }
  function termRe() {
    return new RegExp("(" + st.terms.map(function (x) { return esc(x).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")", "gi");
  }
  function hl(t) { var o = esc(t); return st.terms.length ? o.replace(termRe(), "<mark>$1</mark>") : o; }
  function hlHTML(h) {
    if (!st.terms.length) return h;
    var re = termRe();
    return h.split(/(<[^>]+>)/).map(function (p) { return p.charAt(0) === "<" ? p : p.replace(re, "<mark>$1</mark>"); }).join("");
  }

  /* Year buttons */
  var yb = $("years");
  years.forEach(function (y) {
    var b = document.createElement("button");
    b.type = "button";
    b.dataset.year = y;
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = y + "<span></span>";
    b.addEventListener("click", function () { if (st.years[y]) delete st.years[y]; else st.years[y] = true; render(); });
    yb.appendChild(b);
  });

  /* Section navigation */
  var h = '<ol><li class="all"><a href="#" data-sec=""><span>All sections</span><span class="c"></span></a></li>';
  topSecs.forEach(function (s) {
    h += '<li><a href="#' + s.id + '" data-sec="' + s.id + '"><span>' + esc(s.title) + '</span><span class="c"></span></a>';
    if (children[s.id]) {
      h += "<ol>" + children[s.id].map(function (c) {
        return '<li><a href="#' + c + '" data-sec="' + c + '"><span>' + esc(byId[c].title) + '</span><span class="c"></span></a></li>';
      }).join("") + "</ol>";
    }
    h += "</li>";
  });
  $("toc").innerHTML = h + "</ol>";
  var sel = $("secsel");
  sel.innerHTML = '<option value="">All sections</option>' + topSecs.map(function (s) {
    return '<option value="' + s.id + '">' + esc(s.title) + "</option>" + (children[s.id] || []).map(function (c) {
      return '<option value="' + c + '">   ' + esc(byId[c].title) + "</option>";
    }).join("");
  }).join("");
  sel.addEventListener("change", function () { go(sel.value); });
  $("toc").addEventListener("click", function (ev) {
    var a = ev.target.closest("a[data-sec]");
    if (!a) return;
    ev.preventDefault();
    go(a.dataset.sec);
  });
  function go(id) {
    st.sec = byId[id] ? id : "";
    if (st.sec) { if (location.hash !== "#" + st.sec) location.hash = st.sec; }
    else if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    render();
    var top = $("main").getBoundingClientRect().top + window.scrollY - 80;
    if (window.scrollY > top) window.scrollTo(0, Math.max(0, top));
  }
  window.addEventListener("hashchange", function () {
    var id = location.hash.slice(1);
    if (id !== st.sec) { st.sec = byId[id] ? id : ""; render(); }
  });

  /* Tables */
  function paperTable(list) {
    var rows = list.map(function (e) {
      var code = e.links.filter(function (l) { return isCode(l.label); });
      var other = e.links.filter(function (l) { return !isCode(l.label) && l.url !== e.primary; });
      var links = code.map(function (l) { return '<a class="code" href="' + esc(l.url) + '">' + esc(l.label) + "</a>"; })
        .concat(other.map(function (l) { return '<a href="' + esc(l.url) + '">' + esc(l.label) + "</a>"; })).join(" ");
      return "<tr><td class=\"d\">" + esc(e.date) + "</td><td class=\"n\">" + hl(e.name) + "</td>" +
        '<td class="t"><a href="' + esc(e.primary) + '">' + hl(e.title) + "</a>" + (e.desc ? '<p class="sum">' + hlHTML(e.desc) + "</p>" : "") + "</td>" +
        '<td class="v' + (e.reviewed ? " rev" : "") + '">' + hl(e.venue) + '</td><td class="k">' + links + "</td></tr>";
    }).join("");
    return '<div class="tbl"><table><colgroup><col class="cd"><col class="cn"><col><col class="cv"><col class="ck"></colgroup><thead><tr><th scope="col">Date</th><th scope="col">Name</th><th scope="col">Title</th><th scope="col">Venue</th><th scope="col">Code and links</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
  }
  function linkTable(list) {
    var rows = list.map(function (e) {
      return '<tr><td class="ln"><a href="' + esc(e.url) + '">' + hl(e.name) + '</a></td><td class="ld">' + hlHTML(e.desc) + "</td></tr>";
    }).join("");
    return '<div class="tbl"><table><colgroup><col class="cln"><col></colgroup><thead><tr><th scope="col">Name</th><th scope="col">Description</th></tr></thead><tbody>' + rows + "</tbody></table></div>";
  }
  function table(list) { return list[0].kind === "paper" ? paperTable(list) : linkTable(list); }
  function n(k) { return k + (k === 1 ? " entry" : " entries"); }

  function render() {
    st.terms = st.q.toLowerCase().split(/\s+/).filter(Boolean);
    var shown = all.filter(function (e) { return inScope(e) && pass(e, false); });
    var bySec = {};
    shown.forEach(function (e) { (bySec[e.sec] = bySec[e.sec] || []).push(e); });

    var yc = {};
    papers.forEach(function (e) { if (inScope(e) && pass(e, true)) yc[e.year] = (yc[e.year] || 0) + 1; });
    Array.prototype.forEach.call(yb.children, function (b) {
      var y = +b.dataset.year, k = yc[y] || 0;
      b.querySelector("span").textContent = k;
      b.classList.toggle("zero", k === 0);
      b.setAttribute("aria-pressed", st.years[y] ? "true" : "false");
      b.setAttribute("aria-label", y + ", " + n(k));
    });

    var sc = {}, total = 0;
    all.forEach(function (e) {
      if (!pass(e, false)) return;
      total++;
      sc[e.sec] = (sc[e.sec] || 0) + 1;
      if (e.top !== e.sec) sc[e.top] = (sc[e.top] || 0) + 1;
    });
    Array.prototype.forEach.call($("toc").querySelectorAll("a[data-sec]"), function (a) {
      var id = a.dataset.sec, k = id ? (sc[id] || 0) : total;
      a.querySelector(".c").textContent = k;
      a.classList.toggle("zero", k === 0);
      a.setAttribute("aria-current", id === st.sec ? "true" : "false");
    });
    sel.value = st.sec;

    var active = st.terms.length || yearsOn() || st.code || st.rev;
    var parts = [];
    if (st.terms.length) parts.push("matching " + esc(st.q.trim()));
    var ys = Object.keys(st.years).sort();
    if (ys.length) parts.push("from " + ys.join(", "));
    if (st.code) parts.push("with code");
    if (st.rev) parts.push("in peer-reviewed venues");
    $("status").innerHTML = "<span>Showing " + n(shown.length) + (st.sec ? " in " + esc(byId[st.sec].title) : "") + (parts.length ? " " + parts.join(", ") : "") + ".</span>" +
      (active ? '<button type="button" class="linkbtn" id="reset">Reset filters</button>' : "");
    if (active) $("reset").addEventListener("click", reset);

    var out = "";
    var tops = st.sec ? [byId[st.sec].parent ? byId[byId[st.sec].parent] : byId[st.sec]] : topSecs;
    tops.forEach(function (t) {
      var subs = children[t.id] || [];
      if (st.sec && st.sec !== t.id) subs = [st.sec];
      var k = (bySec[t.id] || []).length + subs.reduce(function (a, c) { return a + (bySec[c] || []).length; }, 0);
      if (!k) return;
      out += '<section class="sec"><h2>' + esc(t.title) + '<span class="c">' + n(k) + "</span></h2>";
      if (t.intro && !active) out += '<div class="secintro"><p>' + t.intro + "</p></div>";
      if (bySec[t.id]) out += table(bySec[t.id]);
      subs.forEach(function (c) {
        var es = bySec[c];
        if (es) out += '<div class="sub"><h3>' + esc(byId[c].title) + '<span class="c">' + n(es.length) + "</span></h3>" + table(es) + "</div>";
      });
      out += "</section>";
    });
    if (!out) {
      out = '<div class="empty"><p>No entries match these filters.</p><p>Remove a year, clear the search or choose all sections.</p>' +
        '<button type="button" class="linkbtn" id="reset2">Reset filters and show all sections</button></div>';
    }
    $("results").innerHTML = out;
    var r2 = $("reset2");
    if (r2) r2.addEventListener("click", function () { reset(); go(""); });
  }
  function reset() {
    st.q = ""; $("q").value = "";
    st.years = {}; st.code = false; st.rev = false;
    $("fcode").checked = false; $("frev").checked = false;
    render();
  }

  var timer;
  $("q").addEventListener("input", function (ev) { clearTimeout(timer); timer = setTimeout(function () { st.q = ev.target.value; render(); }, 90); });
  $("q").addEventListener("keydown", function (ev) { if (ev.key === "Escape") { ev.target.value = ""; st.q = ""; render(); } });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "/" && !/input|select|textarea/i.test(document.activeElement.tagName)) { ev.preventDefault(); $("q").focus(); }
  });
  $("fcode").addEventListener("change", function (ev) { st.code = ev.target.checked; render(); });
  $("frev").addEventListener("change", function (ev) { st.rev = ev.target.checked; render(); });
  function applySum(on) { document.body.classList.toggle("nosum", !on); $("fsum").checked = on; }
  $("fsum").addEventListener("change", function (ev) { applySum(ev.target.checked); store.set("aia-sum", ev.target.checked ? "1" : "0"); });
  applySum(store.get("aia-sum") === "1");
  function applyTheme(t) { document.documentElement.setAttribute("data-theme", t); $("theme").textContent = t === "dark" ? "Light theme" : "Dark theme"; }
  applyTheme(store.get("aia-theme") || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  $("theme").addEventListener("click", function () {
    var t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(t); store.set("aia-theme", t);
  });

  var h0 = location.hash.slice(1);
  st.sec = byId[h0] ? h0 : "";
  render();
})();
</script>
</body>
