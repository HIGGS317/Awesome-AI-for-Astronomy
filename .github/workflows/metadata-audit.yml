name: Metadata Audit

# Once a month, look for preprints that have since been published or retitled.
# The report goes to the run summary and to a single open issue that is updated in place.

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:
    inputs:
      open_issue:
        description: Also open or update the audit issue
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Check preprints against arXiv and Crossref
        run: python scripts/audit.py --out audit.md
      - name: Add the report to the run summary
        run: cat audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the audit issue
        if: github.event_name == 'schedule' || inputs.open_issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Monthly metadata audit
        run: |
          if grep -q "No candidate updates were found" audit.md; then
            echo "Nothing to report."
            exit 0
          fi
          if [ "$(wc -c < audit.md)" -gt 60000 ]; then
            head -c 60000 audit.md > audit.tmp && mv audit.tmp audit.md
            printf '\n\nThe report was shortened to fit an issue. The full report is in the run summary.\n' >> audit.md
          fi
          printf '\n_Generated by the [Metadata Audit workflow](%s/%s/actions/runs/%s)._\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> audit.md
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file audit.md
            echo "Updated issue #$number"
          else
            gh issue create --title "$TITLE" --body-file audit.md
          fi
